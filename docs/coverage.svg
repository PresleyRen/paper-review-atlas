<title id="title">Paper Review Atlas — capability coverage / 论文审查能力地图</title>
<desc id="desc">36 documented capabilities across 9 groups, based on a transparent inventory of 13 repositories and 61 modules. W means written workflow, D means narrow deterministic helper, A means external adapter requirement. Coverage is not measured review accuracy.</desc>
