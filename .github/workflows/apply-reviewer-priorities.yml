name: Apply and validate reviewer-priority update
on:
  push:
    branches: ['feat/reviewer-priorities-v1.2']
    paths: ['.audit/**', '.github/workflows/apply-reviewer-priorities.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply original reviewed source and update registries
        run: python .audit/apply.py
      - name: Execute regression, packaging and real-table checks
        run: python .audit/finalize.py
      - name: Commit verified generated content to the integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md README.en.md docs scripts skills tests
          git commit -m 'feat: reviewer priorities, conditional venue gates and tested repair plans'
          git push origin HEAD:feat/reviewer-priorities-v1.2
      - name: Package final source without temporary integration files
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd()
          with zipfile.ZipFile('/tmp/paper-review-atlas-v1.2.0.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  rel=p.relative_to(root)
                  if p.is_file() and not ({'.git','.audit','__pycache__'} & set(rel.parts)) and rel.as_posix()!='.github/workflows/apply-reviewer-priorities.yml':
                      z.write(p,'paper-review-atlas/'+rel.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-review-atlas-v1.2.0-source
          path: /tmp/paper-review-atlas-v1.2.0.zip
          retention-days: 7
