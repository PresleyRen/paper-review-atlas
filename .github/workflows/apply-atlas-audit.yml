name: Apply and validate Atlas audit
on:
  push:
    branches: ['audit/feature-completeness']
    paths: ['.github/workflows/apply-atlas-audit.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/feature-completeness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Focus exact-ID navigation and strengthen regression assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path('skills/paper-review-atlas/scripts/review_extensions.py')
          text = p.read_text()
          start, end = text.index('def locate('), text.index('\n\ndef calibrate(')
          new = '''def locate(query: str) -> dict:
              """Resolve exact IDs first, then search descriptions without recursive fan-out."""
              if not isinstance(query, str) or not query.strip():
                  raise AuditInputError('locate needs a nonempty ID or search term')
              q = query.strip().casefold()
              caps = load('capabilities')['capabilities']
              features = load('features')['features']
              gaps = load('gaps')['gaps']
              exact_caps = [c for c in caps if c['id'].casefold() == q]
              exact_features = [f for f in features if f['id'].casefold() == q or f['module'].casefold() == q]
              exact_gaps = [g for g in gaps if g['id'].casefold() == q]
              if exact_caps:
                  ids = {c['id'] for c in exact_caps}
                  found_features = [f for f in features if set(f['capabilities']) & ids]
                  found_gaps = [g for g in gaps if set(g['capabilities']) & ids]
              elif exact_features:
                  found_features = exact_features
                  ids = {x for f in exact_features for x in f['capabilities']}
                  found_gaps = [g for g in gaps if set(g['capabilities']) & ids]
              elif exact_gaps:
                  found_gaps = exact_gaps
                  ids = {x for g in exact_gaps for x in g['capabilities']}
                  found_features = [f for f in features if set(f['capabilities']) & ids]
              else:
                  direct = [c for c in caps if q in json.dumps(c, ensure_ascii=False).casefold()]
                  found_features = [f for f in features if q in json.dumps(f, ensure_ascii=False).casefold()]
                  found_gaps = [g for g in gaps if q in json.dumps(g, ensure_ascii=False).casefold()]
                  ids = {c['id'] for c in direct} | {x for f in found_features for x in f['capabilities']} | {x for g in found_gaps for x in g['capabilities']}
              return {'query': query, 'capabilities': [c for c in caps if c['id'] in ids],
                      'features': found_features, 'gaps': found_gaps}
          '''
          p.write_text(text[:start] + new + text[end:])
          p = Path('tests/test_extensions.py')
          text = p.read_text()
          old = "r=ext.locate(query);self.assertTrue(r['capabilities']);self.assertTrue(r['features'])"
          extra = old + "\n        self.assertEqual([c['id'] for c in ext.locate('C19')['capabilities']], ['C19'])\n        self.assertEqual([f['id'] for f in ext.locate('F030')['features']], ['F030'])\n        self.assertEqual([f['module'] for f in ext.locate('academic-paper-reviewer')['features']], ['academic-paper-reviewer'])\n        self.assertEqual([g['id'] for g in ext.locate('G03')['gaps']], ['G03'])"
          assert old in text
          p.write_text(text.replace(old, extra))
          p = Path('docs/validation/v1.1-audit.md')
          p.write_text(p.read_text().replace('These are implementation repairs,', 'An additional CLI smoke check found over-broad exact-ID search results; exact capability, feature, module and gap queries now stay focused, with regression assertions. These are implementation repairs,'))
      - name: Run complete suite and package checks
        run: |
          python -m unittest discover -s tests -v > docs/validation/v1.1-unit-tests.txt 2>&1
          cat docs/validation/v1.1-unit-tests.txt
          python scripts/check_package.py
          python scripts/build_coverage.py --check
          python scripts/build_feature_docs.py --check
          python skills/paper-review-atlas/scripts/atlas.py verify-install
      - name: Refresh actual execution summary
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, sys
          p = pathlib.Path('docs/validation/v1.1-summary.json')
          summary = json.loads(p.read_text())
          data = pathlib.Path('docs/validation/v1.1-unit-tests.txt').read_bytes()
          assert re.findall(r'Ran (\d+) tests', data.decode())[-1] == '247'
          summary.update(python=sys.version, test_log_sha256=hashlib.sha256(data).hexdigest(), execution_url=os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          p.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
      - name: Commit validated navigation repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/paper-review-atlas/scripts/review_extensions.py tests/test_extensions.py docs/validation/v1.1-audit.md docs/validation/v1.1-unit-tests.txt docs/validation/v1.1-summary.json
          git commit -m "fix: keep capability and gap ID navigation precise"
          git push origin HEAD:audit/feature-completeness
