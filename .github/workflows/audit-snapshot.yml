name: Audit inputs and baseline
on:
  push:
    branches: ['audit/feature-completeness']
    paths: ['.github/workflows/audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Baseline tests
        run: |
          mkdir -p /tmp/atlas-audit
          python -m unittest discover -s tests -v > /tmp/atlas-audit/baseline-tests.txt 2>&1
          cat /tmp/atlas-audit/baseline-tests.txt
      - name: Collect public source text for comparison
        shell: python
        run: |
          import concurrent.futures, hashlib, json, pathlib, urllib.parse, urllib.request, zipfile
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/atlas-audit')
          sources = json.loads((root / 'skills/paper-review-atlas/config/sources.json').read_text())['sources']
          def fetch(item):
              sid, name, url = item
              p = urllib.parse.urlparse(url)
              bits = p.path.strip('/').split('/')
              if p.scheme != 'https' or p.netloc != 'github.com' or len(bits) < 6 or bits[2] != 'blob':
                  return dict(source=sid, name=name, url=url, error='unsupported source URL')
              raw = 'https://raw.githubusercontent.com/' + '/'.join(bits[:2] + bits[3:])
              try:
                  with urllib.request.urlopen(raw, timeout=30) as response:
                      data = response.read(512001)
                  if len(data) > 512000:
                      raise ValueError('source too large')
                  data.decode('utf-8')
                  filename = sid + '--' + name.replace('/', '_') + '.md'
                  (out / filename).write_bytes(data)
                  return dict(source=sid, name=name, url=url, path=filename, bytes=len(data), sha256=hashlib.sha256(data).hexdigest(), git_blob=hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest())
              except Exception as exc:
                  return dict(source=sid, name=name, url=url, error=str(exc))
          items = [(s['id'], m['name'], m['url']) for s in sources for m in s['skills']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(fetch, items))
          (out / 'source-manifest.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(out / 'repository.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for path in tracked:
                  if path:
                      z.write(root / path, path)
          print(json.dumps({'source_count': len(results), 'fetched': sum('error' not in r for r in results), 'errors': [r for r in results if 'error' in r]}, ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-audit-inputs
          path: /tmp/atlas-audit/
          retention-days: 1
          if-no-files-found: error
