name: Validate Paper Review Atlas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source-feature matrix and README text maps
        run: python scripts/build_feature_docs.py --check
      - name: Run deterministic and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check portable package
        run: python scripts/check_package.py
      - name: Check generated coverage freshness
        run: python scripts/build_coverage.py --check
      - name: Replay conflict policies
        run: python scripts/compare_policies.py > /tmp/atlas-conflicts.json
      - name: Replay reviewer-priority policies
        run: python scripts/compare_reviewer_priorities.py > /tmp/atlas-priorities.json
      - name: Run public-table priority demo
        run: python scripts/run_priority_demo.py > /tmp/atlas-priority-demo.json
      - name: Verify installed runtime footprint
        run: python skills/paper-review-atlas/scripts/atlas.py verify-install

  required-ci:
    # Branch protection requires this name. Update needs when adding required jobs.
    name: Paper Review Atlas CI
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          printf 'Validation result: %s\n' "$VALIDATION_RESULT"
          test "$VALIDATION_RESULT" = success
